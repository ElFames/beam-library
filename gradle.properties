#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# beam declara su propia jerarquía manual (jvmCommon compartido por androidMain/jvmMain,
# ver beam/build.gradle.kts) en vez de la plantilla por defecto.
kotlin.mpp.applyDefaultHierarchyTemplate=false
# iosMain (compartido por iosArm64/iosSimulatorArm64) referencia tipos del cinterop de
# BeamCryptoKit — hace falta "commonizar" ese cinterop para que un mismo tipo sea visible
# desde el source set compartido en vez de solo desde cada target por separado.
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true